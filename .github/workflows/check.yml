name: Check

# shellcheck, тесты на подменённом корне и сборка .deb — та же точка входа
# tools/check.sh, что запускают руками. Пакет собирается воспроизводимо:
# сумма артефакта CI совпадает с суммой локальной сборки того же коммита.
#
# Тег v* → после проверок job release: сверка тега с VERSION (и с
# debian/changelog, если он есть), сборка .deb и SHA256SUMS, релиз GitHub с
# заметками из секции CHANGELOG.md. Релиз из уже существующего тега —
# ручной запуск с входом tag (Actions → Check → Run workflow).

on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Существующий тег vX.Y.Z: проверить и выпустить его релиз (пусто — только проверки)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: check-${{ inputs.tag || github.event.pull_request.number || github.ref }}
  # Выпуск не прерываем: релиз, собранный наполовину, хуже двух запусков.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.tag }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Ручной запуск с tag проверяет сам тег, а не ветку запуска.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          fetch-depth: 0   # SOURCE_DATE_EPOCH — время последнего коммита
          persist-credentials: false

      - name: Install tools
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends shellcheck lintian

      - name: shellcheck and tests
        run: tools/check.sh
        env:
          CI: "1"

      - name: Build .deb
        run: |
          tools/build-deb.sh
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      # Сведения, а не ворота: пакет собран dpkg-deb без debhelper.
      - name: lintian (informational)
        run: lintian --no-tag-display-limit dist/*.deb || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb
          path: dist/

  release:
    needs: check
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag name
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "::error::тег '$TAG' не похож на vX.Y.Z[-pre]"; exit 1; }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0   # SOURCE_DATE_EPOCH и список тегов для «Latest»
          persist-credentials: false

      - name: Tag matches VERSION and debian/changelog
        id: meta
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          file_ver="$(tr -d '[:space:]' < VERSION)"
          [[ "$file_ver" == "$ver" ]] \
            || { echo "::error::тег $TAG, а VERSION=$file_ver"; exit 1; }
          if [[ -f debian/changelog ]]; then
            deb_ver="$(sed -n '1s/^[^ ]* (\([^)]*\)).*/\1/p' debian/changelog)"
            deb_ver="${deb_ver%-*}"   # без debian-ревизии
            [[ "$deb_ver" == "$ver" ]] \
              || { echo "::error::тег $TAG, а debian/changelog=$deb_ver"; exit 1; }
          fi
          case "$ver" in
            *-rc*|*-beta*|*-alpha*) pre=true ;;
            *) pre=false ;;
          esac
          # «Latest» — только старшей стабильной версии: релиз v3.0.0 задним
          # числом не должен отнять метку у v3.0.1.
          top="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if [[ "$pre" == false && "$TAG" == "$top" ]]; then latest=true; else latest=false; fi
          {
            echo "version=$ver"
            echo "prerelease=$pre"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Секция «## [X.Y.Z] …» до следующего заголовка второго уровня.
          awk -v v="$VERSION" '
            /^## / { if (on) exit; on = (index($0, "## [" v "]") == 1); next }
            on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" \
            || { echo "::error::в CHANGELOG.md нет секции [$VERSION]"; exit 1; }
          cat "$RUNNER_TEMP/notes.md"

      - name: Build .deb and SHA256SUMS
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          rm -r -f dist
          tools/build-deb.sh
          test -f "dist/bisquite-teleport-agent_${VERSION}_all.deb"
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          LATEST: ${{ steps.meta.outputs.latest }}
        run: |
          set -euo pipefail
          files=(dist/*.deb dist/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Релиз уже есть (например, сделан вручную): заметки и флаги не
            # трогаем, файлы заменяем — сборка воспроизводимая, сумма та же.
            echo "релиз $TAG уже существует — обновляю файлы"
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            flags=(--verify-tag --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md" "--latest=$LATEST")
            if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" "${files[@]}" "${flags[@]}"
          fi
