name: teleport-agent
version: 2.4.0
layout: 2
# 2.4.0: join методом bound_keypair (TELEPORT_JOIN_METHOD, секрет регистрации
#        со stdin или из файла, стирается после регистрации; ключ — в
#        /var/lib/teleport); Teleport по умолчанию 18.10.0; метод token и его
#        teleport.yaml не изменились.
# 2.3.0: динамическая метка ноды os_logins — логины ОС с интерактивным shell
#        (root и uid ≥ 1000), команда `bisquite-teleport os-logins` раз в 5 мин;
#        ручка TELEPORT_OS_LOGINS (1 по умолчанию), os_logins зарезервирован
#        в TELEPORT_LABELS.
# 2.2.0: иконка приложения в веб-морде — необязательный ключ ICON= в объявлении
#        apps.d и ручка TELEPORT_APPS_ICONS; teleport.icon зарезервирован
#        в TELEPORT_LABELS (иначе дубль ключа в метках приложения).
# 2.1.0: ручки — домен teleport библиотеки bisquite-conf (схема knobs);
#        bisquite-teleport ставится ссылкой, свои разбор и проверки удалены.
family: deb
# Teleport публикует tarball для amd64 и arm64; arm64 проверен на AGX Orin.
arch: [amd64, arm64]
# Только build: бинарь, CLI и юниты кладутся в образ. Кластер, env и токен —
# на устройстве командой `bisquite-teleport join` из firstboot-commands
# манифеста записи: образ нейтрален к кластеру, первая загрузка расширением
# в сеть не ходит (ходит сам агент, когда его подключили).
phase: build
provides: [teleport-node]
requires: []
conflicts: []
